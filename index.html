<!DOCTYPE html>

<html>

<head>

<title>Registration - Online Bookstore</title>

<style>
/* Define your CSS styles here */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

#header {
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px;
}

#menu {
    background-color: #555;
    color: #fff;
    float: left;
    width: 20%;
    padding: 20px;
}

#content {
    float: left;
    width: 80%;
    padding: 20px;
}

#footer {
    clear: both;
    background-color: #333;
    color: #fff;
    text-align: center;
    padding: 10px;
}

.registration-form {
    margin: 20px;
    padding: 20px;
    background-color: #f2f2f2;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.registration-form label {
    display: block;
    margin-bottom: 10px;
}

.registration-form input[type="text"],
.registration-form input[type="password"],
.registration-form input[type="email"],
.registration-form input[type="tel"],
.registration-form select,
.registration-form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 3px;
}

.registration-form input[type="radio"],
.registration-form input[type="checkbox"] {
    margin-right: 5px;
}
</style>
</head>

<body>

<div id="header">

    <h1>Online Bookstore</h1>

    <p>Logo</p>

</div>

<div id="menu">

    <h2>Web Site Name</h2>

    <ul>

        <li><a href="">Home</a></li>

        <li><a href="">Login</a></li>

        <li><a href="">Registration</a></li>

        <li><a href="">Catalogue</a></li>

        <li><a href="">Cart</a></li>

    </ul>

    <h2>Categories</h2>

    <ul>

        <li><a href="">CSE</a></li>

        <li><a href="">ECE</a></li>

        <li><a href="">EEE</a></li>

        <li><a href="">CIVIL</a></li>

    </ul>

</div>

<div id="content">

    <h2>Registration Form</h2>

    <div class="registration-form">

        <form action="" method="post">

            <label for="name">Name:</label>

            <input type="text" id="name" name="name" required>

            <label for="password">Password:</label>

            <input type="password" id="password" name="password" required>

            <label for="email">E-mail:</label>

            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>

            <input type="tel" id="phone" name="phone" required>

            <label>Sex:</label>

            <input type="radio" id="male" name="sex" value="male" required>

            <label for="male">Male</label>

            <input type="radio" id="female" name="sex" value="female" required>

            <label for="female">Female</label>

            <label for="dob">Date of Birth:</label>

            <select id="day" name="day" required>
                <option value="">Day</option>
                <option value="">1</option>
                <option value="">2</option>
                <option value="">3</option>
                <!-- Add day options here -->
            </select>

            <select id="month" name="month" required>
                <option value="">Month</option>
                <option value="">Jan</option>
                <option value="">Feb</option>
                <!-- Add month options here -->
            </select>

            <select id="year" name="year" required>
                <option value="">Year</option>
                <option value="">1990</option>
                <option value="">1991</option>
                <!-- Add year options here -->
            </select>

            <label>Languages known:</label>

            <input type="checkbox" id="english" name="languages[]" value="english">

            <label for="english">English</label>

            <input type="checkbox" id="telugu" name="languages[]" value="telugu">

            <label for="telugu">Telugu</label>

            <input type="checkbox" id="hindi" name="languages[]" value="hindi">

            <label for="hindi">Hindi</label>

            <input type="checkbox" id="tamil" name="languages[]" value="tamil">

            <label for="tamil">Tamil</label>

            <label for="address">Address:</label>

            <textarea id="address" name="address" rows="4" required></textarea>

            <input type="submit" value="Register">

        </form>

    </div>

</div>

<div id="footer">

    &copy; 2023 Online Bookstore

</div>

</body>

</html>
